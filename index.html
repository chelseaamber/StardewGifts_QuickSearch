<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Villager Gift Search</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <div class="container">
    <h1>🎁 Villager Gift Match</h1>
    <input id="villagerInput" type="text" placeholder="Type a villager name..." autocomplete="off" />
    <div id="villagerSuggestions" class="suggestions"></div>

    <input id="itemInput" type="text" placeholder="Type an item..." autocomplete="off" />
    <div id="itemSuggestions" class="suggestions"></div>

    <div id="result"></div>
  </div>

  <script src="script.js"></script>
</body>
</html>
